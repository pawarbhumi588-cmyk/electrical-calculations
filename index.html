<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Power Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">⚡</div>
        <h1>Electrical Calculator</h1>
        <p>Ohm's Law & Power Calculator</p>
    </div>

    <div class="calculator">
        <h2>Enter Values</h2>

        <div class="input-group">
            <label for="voltage">Voltage (V)</label>
            <input type="number" id="voltage" placeholder="Enter voltage" step="any" min="0">
        </div>

        <div class="input-group">
            <label for="current">Current (A)</label>
            <input type="number" id="current" placeholder="Enter current" step="any" min="0">
        </div>

        <div class="input-group">
            <label for="resistance">Resistance (Ω)</label>
            <input type="number" id="resistance" placeholder="Enter resistance" step="any" min="0">
        </div>

        <div class="buttons">
            <button type="button" onclick="calculate()">Calculate</button>
            <button type="button" class="reset" onclick="resetCalculator()">Reset</button>
        </div>
    </div>

    <div class="result">
        <h2>Result</h2>

        <div class="result-box">
            <div>
                <span>Power</span>
                <strong id="power">-- W</strong>
            </div>

            <div>
                <span>Voltage</span>
                <strong id="resultVoltage">-- V</strong>
            </div>

            <div>
                <span>Current</span>
                <strong id="resultCurrent">-- A</strong>
            </div>

            <div>
                <span>Resistance</span>
                <strong id="resultResistance">-- Ω</strong>
            </div>
        </div>
    </div>

    <div class="formula">
        <h3>Electrical Formulas</h3>
        <p>V = I × R</p>
        <p>P = V × I</p>
        <p>P = I² × R</p>
        <p>P = V² / R</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
